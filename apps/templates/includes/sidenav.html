<aside style="width:240px;background:#141720;border-right:1px solid #262934;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;">
    <div style="padding:20px 20px 16px;border-bottom:1px solid #262934;display:flex;align-items:center;gap:10px;">
        <div style="width:34px;height:34px;background:#3b82f6;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700;">R</div>
        <div>
            <div style="font-size:15px;font-weight:700;color:#e4e6ed;letter-spacing:-0.01em;">RMA Tracker</div>
            <div style="font-size:10px;color:#5d6272;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;">First Quality Air</div>
        </div>
    </div>
    <nav style="flex:1;padding:12px 10px;">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:#5d6272;padding:16px 12px 6px;font-weight:600;">Main</div>
        <a href="{% url 'home' %}" style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:#8b8f9e;font-size:13.5px;font-weight:500;text-decoration:none;transition:all 0.15s;margin-bottom:2px;{% if request.resolver_match.url_name == 'home' %}background:rgba(59,130,246,0.12);color:#3b82f6;{% endif %}"><i class="fas fa-chart-pie" style="width:18px;text-align:center;font-size:14px;"></i> Dashboard</a>
        <a href="{% url 'claim_list' %}" style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:#8b8f9e;font-size:13.5px;font-weight:500;text-decoration:none;transition:all 0.15s;margin-bottom:2px;{% if 'claim' in request.resolver_match.url_name %}background:rgba(59,130,246,0.12);color:#3b82f6;{% endif %}"><i class="fas fa-file-invoice" style="width:18px;text-align:center;font-size:14px;"></i> Warranty Claims</a>
        <a href="{% url 'parts_return_list' %}" style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:#8b8f9e;font-size:13.5px;font-weight:500;text-decoration:none;transition:all 0.15s;margin-bottom:2px;{% if 'parts_return' in request.resolver_match.url_name %}background:rgba(59,130,246,0.12);color:#3b82f6;{% endif %}"><i class="fas fa-box" style="width:18px;text-align:center;font-size:14px;"></i> Parts Returns</a>
        {% if user.is_superuser %}
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:#5d6272;padding:16px 12px 6px;font-weight:600;">Admin</div>
        <a href="{% url 'invite_user' %}" style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:#8b8f9e;font-size:13.5px;font-weight:500;text-decoration:none;transition:all 0.15s;margin-bottom:2px;{% if request.resolver_match.url_name == 'invite_user' %}background:rgba(59,130,246,0.12);color:#3b82f6;{% endif %}"><i class="fas fa-user-plus" style="width:18px;text-align:center;font-size:14px;"></i> Invite Users</a>
        {% endif %}
    </nav>
    <div style="padding:12px 10px;border-top:1px solid #262934;">
        <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;">
            <div style="width:32px;height:32px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:600;">{{ user.username|slice:":2"|upper }}</div>
            <div style="font-size:12.5px;">
                <div style="font-weight:600;color:#e4e6ed;">{{ user.username }}</div>
                <div style="color:#5d6272;font-size:11px;">{% if user.is_superuser %}Administrator{% else %}Technician{% endif %}</div>
            </div>
        </div>
    </div>
</aside>

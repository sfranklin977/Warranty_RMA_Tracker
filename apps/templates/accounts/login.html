<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMA Tracker — Sign In</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e4e6ed; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: #1a1d27; border: 1px solid #262934; border-radius: 10px; padding: 36px; width: 380px; text-align: center; }
        .login-card .login-icon { width: 48px; height: 48px; background: rgba(59,130,246,0.12); border-radius: 6px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #3b82f6; }
        .login-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .login-sub { font-size: 13px; color: #5d6272; margin-bottom: 24px; }
        .form-group { text-align: left; margin-bottom: 14px; }
        .form-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #5d6272; font-weight: 600; margin-bottom: 5px; display: block; }
        .input-group { display: flex; }
        .input-group-text { background: #141720; border: 1px solid #262934; border-right: none; padding: 8px 12px; border-radius: 6px 0 0 6px; color: #5d6272; font-size: 14px; display: flex; align-items: center; }
        .form-input { width: 100%; padding: 8px 12px; font-size: 13px; font-family: inherit; background: #0f1117; border: 1px solid #262934; border-radius: 0 6px 6px 0; color: #e4e6ed; }
        .form-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .btn { width: 100%; justify-content: center; padding: 10px; font-size: 14px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; font-weight: 500; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; }
        .btn:hover { background: #2563eb; }
        .alert { padding: 10px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; text-align: left; background: rgba(239,68,68,0.12); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-icon"><i class="fas fa-clipboard-check"></i></div>
        <h2>Warranty RMA Tracker</h2>
        <p class="login-sub">First Quality Air</p>
        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    {{ form.username }}
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    {{ form.password }}
                </div>
            </div>
            <button type="submit" class="btn"><i class="fas fa-sign-in-alt"></i> Sign In</button>
        </form>
    </div>
</body>
</html>
